<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Русалочка</title>
<style>
:root{--bg1:#e8eef5;--bg2:#4a5a80;--ink:#1e2a4a;--card:rgba(255,255,255,.6);--accent:#d4a017;--btn:#1e2a4a;--btnText:#eaf2ff;--shadow:rgba(20,30,70,.35);--meter:linear-gradient(90deg,#6fb1ff,#ffd166,#d4a017)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2) 85%);transition:background .4s}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:18px 20px 0;text-align:center}
h1{margin:0;font-size:30px;letter-spacing:.5px}
h1 small{display:block;font-size:14px;font-weight:400;opacity:.75;margin-top:2px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:520px;padding:4px 16px}
svg{width:100%;height:auto;max-height:68vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:filter .35s;filter:drop-shadow(0 18px 28px var(--shadow))}
svg.muted{filter:drop-shadow(0 18px 28px var(--shadow)) grayscale(.6) brightness(.8)}
.floor{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.08)}
.floor.me{background:var(--accent);color:#fff}
.pitch{font-size:12px;font-weight:700;min-width:70px;opacity:.75;font-variant-numeric:tabular-nums}
.panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--card);
  backdrop-filter:blur(8px);border-radius:18px;padding:12px 16px;margin:0 16px 22px;box-shadow:0 6px 20px var(--shadow)}
button{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;background:var(--btn);color:var(--btnText);cursor:pointer;transition:transform .1s,background .2s}
button:hover{transform:translateY(-1px)}
button.on{background:var(--accent);color:#fff}
label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
select{border:0;border-radius:999px;padding:9px 14px;font:inherit;font-weight:600;font-size:14px;background:rgba(255,255,255,.85);color:inherit;max-width:230px}
select[hidden]{display:none}
input[type=range]{width:110px;accent-color:var(--accent)}
.meter{width:110px;height:10px;border-radius:5px;background:rgba(0,0,0,.12);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--meter)}
.status{font-size:14px;min-width:150px;text-align:center;font-weight:600}
.hint{font-size:12px;opacity:.7;text-align:center;margin:-10px 16px 16px}
.bubble{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 16px;
  font-size:15px;font-weight:700;box-shadow:0 8px 24px var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;color:#1e2a4a;z-index:60}
.bubble.show{opacity:1}
/* декор персонажей */
.bub{animation:rise linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.75}100%{transform:translateY(-470px);opacity:0}}
.ray{animation:sway 7s ease-in-out infinite alternate;transform-origin:200px 0}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.leaf{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(-40px,500px) rotate(300deg);opacity:0}}
.bokeh{animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.4}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(420px)}}
.flag{animation:wave 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes wave{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
</style>
</head>
<body>
<header><h1>Русалочка <small>говорите — и заговорит</small></h1></header>
<div class="bubble" id="bubble"></div>
<div class="stage"></div>
<div class="panel">
  <button id="micBtn">🎙 Включить микрофон</button>
  <select id="devSel" hidden title="Какой микрофон слушать"></select>
  <select id="voiceSel" title="На какой голос реагировать"><option value="any">Голос: любой</option><option value="female">Голос: женский</option><option value="male">Голос: мужской</option></select>
  <button id="demoBtn">▶ Демо</button>
  <button id="sayBtn">🗣 Реплика</button>
  <button id="sigBtn">🔔 Слово по сигналу</button>
  <div class="floor" id="floor" hidden></div>
  <label>Чувствительность <input id="sens" type="range" min="0" max="1" step="0.01" value="0.6"></label>
  <div class="meter"><i id="meter"></i></div>
  <span class="pitch" id="pitch"></span>
  <div class="status" id="status">Микрофон выключен</div>
</div>
<div class="hint" id="hint">Тап по персонажу — его аккорд: слово переходит к нему на всех устройствах</div>
<script>window.TH_DEFAULT='rusalochka';</script>
<script src="tones.js?v=16"></script>
<script src="chars.js?v=16"></script>
<script src="core.js?v=16"></script>
</body>
</html>
