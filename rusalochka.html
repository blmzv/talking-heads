<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Русалочка</title>
<style>
:root{--bg1:#bfeff5;--bg2:#1f6f9c;--ink:#0d3a55;--card:rgba(255,255,255,.6);--accent:#e63a2e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2) 85%)}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:18px 20px 0;text-align:center}
h1{margin:0;font-size:30px;letter-spacing:.5px}
h1 small{display:block;font-size:14px;font-weight:400;opacity:.75;margin-top:2px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:520px;padding:4px 16px}
svg{width:100%;height:auto;max-height:68vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:filter .35s;filter:drop-shadow(0 18px 28px rgba(0,40,70,.35))}
svg.muted{filter:drop-shadow(0 18px 28px rgba(0,40,70,.35)) grayscale(.6) brightness(.8)}
.floor{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.08)}
.floor.me{background:var(--accent);color:#fff}
.panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--card);
  backdrop-filter:blur(8px);border-radius:18px;padding:12px 16px;margin:0 16px 22px;box-shadow:0 6px 20px rgba(0,40,70,.15)}
button{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;background:#0d3a55;color:#dff8ff;cursor:pointer;transition:transform .1s,background .2s}
button:hover{transform:translateY(-1px)}
button.on{background:var(--accent);color:#fff}
label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
select{border:0;border-radius:999px;padding:9px 14px;font:inherit;font-weight:600;font-size:14px;background:rgba(255,255,255,.85);color:inherit;max-width:230px}
select[hidden]{display:none}
input[type=range]{width:110px;accent-color:var(--accent)}
.meter{width:110px;height:10px;border-radius:5px;background:rgba(0,0,0,.12);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd1c5,#ffd166,#ff7a8a)}
.status{font-size:14px;min-width:150px;text-align:center;font-weight:600}
.hint{font-size:12px;opacity:.7;text-align:center;margin:-10px 16px 16px}
.bubble{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 16px;
  font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,40,70,.25);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;color:#0d3a55}
.bubble.show{opacity:1}
/* пузырьки */
.bub{animation:rise linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.75}100%{transform:translateY(-470px);opacity:0}}
.ray{animation:sway 7s ease-in-out infinite alternate;transform-origin:200px 0}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
</head>
<body>
<header><h1>Русалочка <small>говорите — и она заговорит</small></h1></header>
<div class="bubble" id="bubble"></div>

<div class="stage">
<svg id="char" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" aria-label="Русалочка">

    <!-- пузырьки -->
    <circle class="bub" cx="60" cy="470" r="5" fill="#fff" style="animation-duration:9s;animation-delay:-2s"/>
    <circle class="bub" cx="340" cy="470" r="7" fill="#fff" style="animation-duration:11s;animation-delay:-6s"/>
    <circle class="bub" cx="110" cy="470" r="3.5" fill="#fff" style="animation-duration:7s;animation-delay:-4s"/>

    <circle class="bub" cx="30" cy="470" r="3" fill="#fff" style="animation-duration:10s;animation-delay:-7s"/>
    <circle class="bub" cx="375" cy="470" r="3" fill="#fff" style="animation-duration:12s;animation-delay:-3s"/>

      <path d="M130,200 C150,300 140,380 120,440" stroke="#ff9a7a" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
      <path d="M280,210 C262,300 276,380 296,430" stroke="#ff9a7a" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    </g>

    <!-- хвост -->
    <g id="tail">
      <path d="M126,396 C110,440 150,470 205,466 C262,462 296,440 328,458 C344,468 362,476 378,466 C366,452 360,436 350,414 C340,432 320,440 300,430 C286,412 280,402 274,396 Q200,420 126,396Z" fill="url(#tail)"/>
      <path d="M126,396 C110,440 150,470 205,466 C262,462 296,440 328,458 C344,468 362,476 378,466 C366,452 360,436 350,414 C340,432 320,440 300,430 C286,412 280,402 274,396 Q200,420 126,396Z" fill="url(#scales)"/>

    </g>

    <!-- шея, плечи, торс -->

    <!-- ракушки -->

      <path d="M144,356 A30,30 0 0 1 204,356 L174,386Z"/>
      <path d="M196,356 A30,30 0 0 1 256,356 L226,386Z"/>
    </g>
    <g stroke="#c99ae6" stroke-width="2" fill="none" opacity=".9">
      <path d="M174,386 L150,352 M174,386 L162,342 M174,386 L174,338 M174,386 L186,342 M174,386 L198,352"/>
      <path d="M226,386 L202,352 M226,386 L214,342 M226,386 L226,338 M226,386 L238,342 M226,386 L250,352"/>
    </g>
    <!-- жемчуг -->
    <g fill="#fff8f0" stroke="#d9c7b8" stroke-width=".6">
      <circle cx="158" cy="332" r="4.5"/><circle cx="169" cy="339" r="4.5"/><circle cx="181" cy="343" r="4.5"/><circle cx="193" cy="345" r="4.5"/>
      <circle cx="207" cy="345" r="4.5"/><circle cx="219" cy="343" r="4.5"/><circle cx="231" cy="339" r="4.5"/><circle cx="242" cy="332" r="4.5"/>
    </g>

    <!-- голова -->
    <g id="head">
      <ellipse cx="200" cy="206" rx="78" ry="88" fill="url(#skin)"/>
      <!-- ушки -->
      <ellipse cx="124" cy="212" rx="9" ry="13" fill="#f2bfa0"/><ellipse cx="276" cy="212" rx="9" ry="13" fill="#f2bfa0"/>
      <!-- щёчки -->
      <ellipse cx="156" cy="242" rx="14" ry="8" fill="#ff8f9a" opacity=".4"/>
      <ellipse cx="244" cy="242" rx="14" ry="8" fill="#ff8f9a" opacity=".4"/>

      <g id="brows" stroke="#a52a1a" stroke-width="3.2" fill="none" stroke-linecap="round">
        <path d="M150,178 Q170,167 190,175"/><path d="M250,178 Q230,167 210,175"/>

      <g id="eyeL" class="eye">
        <ellipse cx="170" cy="206" rx="16" ry="19" fill="#fff"/>

      <g clip-path="url(#mouthClip)">
        <ellipse id="tongue" cx="200" cy="290" rx="16" ry="8" fill="#f07a8a"/>
        <ellipse id="teeth" cx="200" cy="258" rx="14" ry="4" fill="#fff"/>
      </g>

      <!-- волосы спереди -->
      <g id="hairFront">
        <path d="M120,196 C112,108 176,90 200,114 C226,88 292,108 280,196 C266,156 246,146 226,164 C206,128 164,138 120,196Z" fill="url(#hair2)"/>
        <path d="M134,186 C140,150 166,134 190,140" stroke="#ffb09a" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>

          <circle cx="0" cy="0" r="2" fill="#fff2c2"/><circle cx="0" cy="-8" r="1.3" fill="#fff2c2"/><circle cx="7" cy="-1" r="1.3" fill="#fff2c2"/><circle cx="-7" cy="-1" r="1.3" fill="#fff2c2"/>

</div>

<div class="panel">
  <button id="micBtn">🎙 Включить микрофон</button>
  <select id="devSel" hidden title="Какой микрофон слушать"></select>
  <button id="demoBtn">▶ Демо</button>
  <button id="sayBtn">🗣 Реплика</button>
  <button id="cwBtn">🗝 Кодовое слово</button>
  <div class="floor" id="floor" hidden></div>
  <label>Чувствительность <input id="sens" type="range" min="0" max="1" step="0.01" value="0.6"></label>
  <div class="meter"><i id="meter"></i></div>
  <div class="status" id="status">Микрофон выключен</div>
</div>
<div class="hint" id="hint">Держите пробел или палец на персонаже — «заговорит» без микрофона</div>

<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(cur,target,tau,dt)=>lerp(cur,target,1-Math.exp(-dt/tau));

const S={raw:0,level:0,talk:0,open:0,mode:'idle',prevMode:'idle',
  blinkT:-1,nextBlink:1.5,gaze:{x:0,y:0,tx:0,ty:0,next:1.5},
  demoTarget:0,demoNext:0,keyHeld:false,cw:false,floor:'none',bubT:0};
let audio=null;

// ---------- аудио ----------
const DEV_KEY='th_dev_rusalochka';
function savedDevice(){ try{return localStorage.getItem(DEV_KEY)||'';}catch(e){return '';} }
async function listDevices(){
  try{
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    const sel=$('#devSel'); const cur=audio?audio.stream.getAudioTracks()[0].getSettings().deviceId:savedDevice();
    sel.innerHTML='';
    devs.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('Микрофон '+(i+1));if(d.deviceId===cur)o.selected=true;sel.appendChild(o);});
    sel.hidden=devs.length<2;
  }catch(e){console.warn(e);}
}
async function startMic(deviceId){
  try{
    deviceId=deviceId||savedDevice();
    const audioC={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
    if(deviceId) audioC.deviceId={exact:deviceId};
    let stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:audioC}); }
    catch(e){ if(deviceId){delete audioC.deviceId; stream=await navigator.mediaDevices.getUserMedia({audio:audioC});} else throw e; }
    if(audio){ audio.stream.getTracks().forEach(t=>t.stop()); audio.ctx.close(); audio=null; }
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0;
    src.connect(analyser);
    audio={ctx,stream,analyser,data:new Uint8Array(analyser.fftSize)};
    if(ctx.state==='suspended') await ctx.resume();
    setMode('mic'); $('#micBtn').classList.add('on'); $('#micBtn').textContent='⏹ Выключить микрофон';
    const used=stream.getAudioTracks()[0]; try{localStorage.setItem(DEV_KEY,used.getSettings().deviceId||'');}catch(e){}
    await listDevices();
    showBubble('Слушаю: '+(used.label||'микрофон'),2500);
  }catch(e){
    console.error(e);
    $('#status').textContent='Нет доступа к микрофону';
    showBubble('Микрофон не дали… Нажмите «Демо» или держите пробел');
  }
}
function stopMic(){
  if(audio){ audio.stream.getTracks().forEach(t=>t.stop()); audio.ctx.close(); audio=null; }
  $('#micBtn').classList.remove('on'); $('#micBtn').textContent='🎙 Включить микрофон';
  if(S.mode==='mic') setMode('idle');
}
function readMic(){
  const {analyser,data}=audio; analyser.getByteTimeDomainData(data);
  let sum=0; for(let i=0;i<data.length;i++){const v=(data[i]-128)/128; sum+=v*v;}
  return Math.sqrt(sum/data.length);
}
function micTarget(rms){
  const sens=parseFloat($('#sens').value);
  const thr=0.003+(1-sens)*0.03, range=0.05+(1-sens)*0.3;
  return clamp((rms-thr)/range,0,1);
}
function demoLevel(dt){
  S.demoNext-=dt;
  if(S.demoNext<=0){
    if(Math.random()<0.16){S.demoTarget=0;S.demoNext=0.3+Math.random()*0.5;}
    else{S.demoTarget=0.35+Math.random()*0.65;S.demoNext=0.07+Math.random()*0.15;}
  }
  return S.demoTarget;
}
function setMode(m){ if(m!==S.mode) S.prevMode=S.mode; S.mode=m; $('#demoBtn').classList.toggle('on',m==='demo'); }

// ---------- реплики ----------
const PHRASES=['Я так хочу увидеть мир над волнами!','Слышите? Это шумит море.',
 'На дне морском сегодня тихо-тихо…','Каждая жемчужина — это чья-то сказка.',
 'Идёмте со мной, я покажу вам коралловый сад!','Говорят, у людей вместо хвоста — две ноги. Странно!'];
function showBubble(t,ms=3500){const b=$('#bubble');b.textContent=t;b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),ms);}
function say(){
  const text=PHRASES[Math.floor(Math.random()*PHRASES.length)];
  showBubble(text,5000);
  const back=S.mode==='speak'?S.prevMode:S.mode;
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='ru-RU'; u.pitch=1.4; u.rate=1.0;
    const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ru')); if(v) u.voice=v;
    u.onstart=()=>setMode('speak');
    u.onend=u.onerror=()=>{ if(S.mode==='speak'){S.mode=back;$('#demoBtn').classList.toggle('on',back==='demo');} };
    setMode('speak'); speechSynthesis.speak(u);
    setTimeout(()=>{ if(S.mode==='speak'&&!speechSynthesis.speaking){S.mode=back;} },2500);
  }else{ setMode('speak'); setTimeout(()=>{S.mode=back;},3000); }
}

// ---------- UI ----------
$('#micBtn').onclick=()=>audio?stopMic():startMic();
$('#devSel').onchange=e=>{ try{localStorage.setItem(DEV_KEY,e.target.value);}catch(err){} startMic(e.target.value); };
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange',listDevices);
$('#demoBtn').onclick=()=>{ if(S.mode==='demo'){setMode(audio?'mic':'idle');} else setMode('demo'); };
$('#sayBtn').onclick=say;
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();S.keyHeld=true;} });
addEventListener('keyup',e=>{ if(e.code==='Space')S.keyHeld=false; });
const svgEl=$('#char'); svgEl.style.touchAction='none';
svgEl.addEventListener('pointerdown',e=>{e.preventDefault(); if(S.cw){setFloor(S.floor==='me'?'none':'me');} else S.keyHeld=true;});
['pointerup','pointercancel','pointerleave'].forEach(ev=>svgEl.addEventListener(ev,()=>{S.keyHeld=false;}));
svgEl.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- кодовое слово ----------
const ME_ROOT='русалоч', OT_ROOT='белоснеж';
let rec=null, recSeen='', recRestartT=null;
const norm=t=>t.toLowerCase().replace(/ё/g,'е');
function setFloor(f){
  S.floor=f;
  $('#char').classList.toggle('muted',S.cw&&f!=='me');
  const b=$('#floor'); b.hidden=!S.cw; b.classList.toggle('me',f==='me');
  b.textContent= f==='me'?'Слово у Русалочки':f==='other'?'Слово у Белоснежки':'Слово свободно';
}
function handleTranscript(tr,isFinal){
  const t=norm(tr);
  const fresh=t.startsWith(recSeen)?t.slice(recSeen.length):t;
  recSeen=isFinal?'':t;
  const a=fresh.lastIndexOf(ME_ROOT), b=fresh.lastIndexOf(OT_ROOT);
  if(a<0&&b<0) return;
  setFloor(a>b?'me':'other');
}
function runRec(){
  if(!S.cw) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); rec.lang='ru-RU'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; handleTranscript(r[0].transcript,r.isFinal); } };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){ stopCW(); showBubble('Распознавание речи запрещено в браузере'); }
    else if(e.error==='network'){ showBubble('Распознаванию нужен интернет',2500); }
  };
  rec.onend=()=>{ recSeen=''; if(S.cw){ clearTimeout(recRestartT); recRestartT=setTimeout(runRec,250); } };
  try{ rec.start(); }catch(err){ console.warn(err); }
}
function startCW(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showBubble('В этом браузере нет распознавания речи. Попробуйте Safari или Chrome.'); return; }
  S.cw=true; $('#cwBtn').classList.add('on'); setFloor('none');
  $('#hint').textContent='Скажите имя персонажа — слово перейдёт к ней. Тап по персонажу тоже передаёт слово.';
  if(!audio) startMic();
  runRec();
  showBubble('Жду имена: «Русалочка» или «'+'Белоснежки'.replace(/и$/,'а')+'»',3000);
}
function stopCW(){
  S.cw=false; $('#cwBtn').classList.remove('on'); clearTimeout(recRestartT);
  if(rec){ try{rec.onend=null; rec.stop();}catch(e){} rec=null; }
  setFloor('none');
  $('#hint').textContent='Держите пробел или палец на персонаже — «заговорит» без микрофона';
}
$('#cwBtn').onclick=()=>S.cw?stopCW():startCW();

// ---------- анимация ----------
const el={head:$('#head'),brows:$('#brows'),mouth:$('#mouth'),clip:$('#mouthClipPath'),
  tongue:$('#tongue'),teeth:$('#teeth'),hairBack:$('#hairBack'),hairFront:$('#hairFront'),tail:$('#tail'),
  eyes:[$('#eyeL'),$('#eyeR')],pupils:document.querySelectorAll('.pupil'),meter:$('#meter'),status:$('#status'),
  talkBubbles:$('#talkBubbles')};
const EYE=[{x:170,y:206},{x:230,y:206}];

// пузырьки изо рта, когда говорит
function spawnBubble(){
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  const x=205+Math.random()*30, r=2+Math.random()*3;
  c.setAttribute('cx',x); c.setAttribute('cy',255); c.setAttribute('r',r); c.setAttribute('fill','#fff'); c.setAttribute('opacity','.8');
  el.talkBubbles.appendChild(c);
  const t0=performance.now();
  const tick=now=>{const p=(now-t0)/2200; if(p>=1){c.remove();return;}
    c.setAttribute('cy',255-p*240); c.setAttribute('cx',x+Math.sin(p*9)*8); c.setAttribute('opacity',(0.8*(1-p)).toFixed(2)); requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;
  let target=0;
  if(S.mode==='mic'&&audio){ S.raw=readMic(); target=micTarget(S.raw); if(S.cw&&S.floor!=='me') target=0; }
  else if(S.mode==='demo'||S.mode==='speak'){ target=demoLevel(dt); }
  if(S.keyHeld) target=Math.max(target,demoLevel(dt));

  S.level=smooth(S.level,target,target>S.level?0.025:0.09,dt);
  S.talk=smooth(S.talk,S.level>0.08?1:0,0.25,dt);
  const flutter=0.82+0.18*Math.sin(t*23)*Math.sin(t*7.3);
  S.open=smooth(S.open,S.level*flutter,0.03,dt);

  S.nextBlink-=dt;
  if(S.nextBlink<=0){S.blinkT=0;S.nextBlink=Math.random()<0.25?0.35:2+Math.random()*4;}
  let blink=0;
  if(S.blinkT>=0){S.blinkT+=dt;const p=S.blinkT/0.18;blink=p>=1?0:Math.sin(Math.PI*p);if(p>=1)S.blinkT=-1;}

  S.gaze.next-=dt;
  if(S.gaze.next<=0){S.gaze.tx=(Math.random()*2-1);S.gaze.ty=(Math.random()*2-1)*0.6;S.gaze.next=1.2+Math.random()*3;}
  S.gaze.x=smooth(S.gaze.x,S.gaze.tx,0.25,dt); S.gaze.y=smooth(S.gaze.y,S.gaze.ty,0.25,dt);

  S.bubT-=dt; if(S.talk>0.5&&S.level>0.5&&S.bubT<=0){spawnBubble();S.bubT=0.35+Math.random()*0.5;}

  render(t,blink);
  el.meter.style.width=(S.level*100).toFixed(0)+'%';
  el.status.textContent= S.mode==='mic'?(S.cw?(S.floor==='me'?(S.talk>0.5?'Говорит 🗣':'Слово у меня'):S.floor==='other'?'Слово у Белоснежки':'Ждём имя…'):(S.talk>0.5?'Говорит 🗣':'Слушаю…')):
    S.mode==='demo'?'Демо-режим':S.mode==='speak'?'Говорит сама 🗣':(S.keyHeld?'Говорит (удержание)':'Микрофон выключен');
  requestAnimationFrame(frame);
}

function render(t,blink){
  const o=S.open, L=S.level, tk=S.talk;
  // рот
  const y0=260, cy=y0+o*4, top=y0-o*9, bot=y0+5+o*36;
  const d=`M183,${cy} Q200,${top} 217,${cy} Q200,${bot} 183,${cy} Z`;
  el.mouth.setAttribute('d',d); el.clip.setAttribute('d',d);
  el.tongue.setAttribute('cy',bot-4); el.tongue.setAttribute('ry',4+o*10);
  el.teeth.setAttribute('cy',top+3); el.teeth.setAttribute('opacity',o>0.25?1:0);

  // голова
  const tilt=Math.sin(t*0.7)*2+Math.sin(t*4.6)*3.5*tk*L;
  const bob=Math.sin(t*1.3)*3-Math.abs(Math.sin(t*8.2))*5*L;
  el.head.setAttribute('transform',`translate(0 ${bob.toFixed(2)}) rotate(${tilt.toFixed(2)} 200 330)`);
  // волосы плывут
  const hx=Math.sin(t*0.9)*4, hy=Math.sin(t*1.3+1)*3;
  el.hairBack.setAttribute('transform',`translate(${hx.toFixed(2)} ${hy.toFixed(2)}) skewX(${(Math.sin(t*0.6)*2).toFixed(2)})`);
  el.hairFront.setAttribute('transform',`translate(${(hx*0.4).toFixed(2)} ${(Math.sin(t*1.1)*1.5).toFixed(2)})`);
  // хвост качается
  const sw=Math.sin(t*1.1)*3+Math.sin(t*6)*3*L;
  el.tail.setAttribute('transform',`rotate(${sw.toFixed(2)} 200 396)`);
  // брови
  el.brows.setAttribute('transform',`translate(0 ${(-7*L).toFixed(2)})`);
  // глаза
  const widen=1+0.1*clamp((L-0.7)/0.3,0,1);
  el.eyes.forEach((e,i)=>{const c=EYE[i];
    e.setAttribute('transform',`translate(${c.x} ${c.y}) scale(${widen} ${((1-blink*0.96)*widen).toFixed(3)}) translate(${-c.x} ${-c.y})`);});
  const gx=S.gaze.x*4, gy=S.gaze.y*3-1.5*tk;
  el.pupils.forEach(p=>p.setAttribute('transform',`translate(${gx.toFixed(2)} ${gy.toFixed(2)})`));
}
requestAnimationFrame(frame);
if('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
