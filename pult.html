<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Пульт сказки</title>
<style>
:root{--ink:#1f2233;--bg:#f4efe6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
h1{margin:0 0 4px;font-size:24px;text-align:center}
p.sub{margin:0 0 16px;text-align:center;font-size:14px;opacity:.7}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(140px,1fr);gap:14px}
.btn{border:0;border-radius:24px;color:#fff;font:inherit;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 24px rgba(0,0,0,.15);cursor:pointer;transition:transform .08s,box-shadow .2s,outline .2s;outline:4px solid transparent;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn.active{outline-color:#fff;box-shadow:0 0 0 6px rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.2)}
.btn span{font-size:44px;line-height:1}
.btn small{font-size:13px;font-weight:600;opacity:.9}
#b-rusalochka{background:linear-gradient(160deg,#2aa6c9,#e63a2e)}
#b-belosnezhka{background:linear-gradient(160deg,#3b56c9,#d62839)}
#b-prince{background:linear-gradient(160deg,#3f5f9e,#d4a017)}
#b-silence{background:linear-gradient(160deg,#6b7280,#1f2233)}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:14px;font-weight:600}
input[type=range]{width:160px;accent-color:#1f2233}
.nl{text-decoration:none;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;color:inherit;background:rgba(0,0,0,.07)}
.hint{text-align:center;font-size:12px;opacity:.65;margin-top:8px}
</style>
</head>
<body>
<h1>Пульт сказки</h1>
<p class="sub">Нажмите, кто говорит. Аккорд услышат все экраны.</p>
<nav style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:-6px 0 14px"><a href="rusalochka.html" class="nl">🧜‍♀️ Русалочка</a><a href="belosnezhka.html" class="nl">🍎 Белоснежка</a><a href="prince.html" class="nl">👑 Принц</a></nav>
<div class="grid">
  <button class="btn" id="b-rusalochka" data-key="rusalochka"><span>🧜‍♀️</span>Русалочка<small>до мажор</small></button>
  <button class="btn" id="b-belosnezhka" data-key="belosnezhka"><span>🍎</span>Белоснежка<small>фа мажор</small></button>
  <button class="btn" id="b-prince" data-key="prince"><span>👑</span>Принц<small>соль мажор</small></button>
  <button class="btn" id="b-silence" data-key="silence"><span>🤫</span>Тишина<small>ре минор</small></button>
</div>
<div class="foot"><label>Громкость <input id="vol" type="range" min="0.1" max="1" step="0.05" value="0.6"></label></div>
<div class="hint">Громкость телефона — выше половины. Если экран не отреагировал, нажмите ещё раз.</div>
<script src="tones.js?v=16"></script>
<script>
const vol=document.getElementById('vol');
try{ vol.value=localStorage.getItem('th_pult_vol')||vol.value; }catch(e){}
vol.oninput=()=>{ try{localStorage.setItem('th_pult_vol',vol.value);}catch(e){} };
let busy=false;
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(busy) return; busy=true;
    document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    const ms=thPlayTone(b.dataset.key,parseFloat(vol.value)*0.7);
    if(navigator.vibrate) navigator.vibrate(30);
    setTimeout(()=>{busy=false;},ms+80);
  });
});
</script>
</body>
</html>
